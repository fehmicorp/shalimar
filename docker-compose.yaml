services:
  app:
    container_name: Application
    build: shalimar-corp:1.0.1
    env_file:
      - .env
    ports:
      - ${CORP_APP_PORT}:3000
    depends_on:
      - pgsql
      - redis

  admin:
    container_name: Admin Panel
    build: shalimar-admin:1.0.1
    env_file:
      - .env
    ports:
      - ${ADMIN_APP_PORT}:3000
    depends_on:
      - pgsql
      - redis
  
  s3:
    container_name: s3-assets
    build: shalimar-s3:1.0.1
    env_file:
      - .env
    ports:
      - ${S3_MINIO_PORT}:9090
      - ${S3_ADMIN_PORT}:9091
      - ${S3_APP_PORT}:9098
    volumes:
      - s3-data:/data
      - s3-backup:/backup
    depends_on:
      - pgsql
      - redis

  pgsql:
    container_name: Postgresql Database
    image: postgres:latest
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    container_name: Redis Database
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: 
      - redis-server
      - --requirepass
      - {{REDIS_PASSWORD}}
      - --databases
      - "11"
    volumes:
      - redis:/data

    cloudflare:
      image: cloudflare/cloudflared:latest
      container_name: cloudflare-tunnel
      command: tunnel --no-autoupdate run --token {{CF_TOKEN}}
      restart: unless-stopped

volumes:
  redis: ./data/redis
  postgres: ./data/postgres
  s3-data: ./data/s3/data
  s3-backup: ./data/s3/backup

networks:
  default:
    external:
      name: shalimar-network
      ipv4_address:
