services:
  app:
    container_name: Application
    build: shalimar-corp:1.0.1
    env_file:
      - .env
    ports:
      - 3000:3000
    depends_on:
      - pgsql
      - redis
  
  s3:
    container_name: s3-assets
    build: shalimar-s3:1.0.1
    env_file:
      - .env
    ports:
      - 9090:9090

  pgsql:
    container_name: Postgresql Database
    image: postgres:latest
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    container_name: Redis Database
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: 
      - redis-server
      - --requirepass
      - {{REDIS_PASSWORD}}
      - --databases
      - "11"
    volumes:
      - redis:/data

    cloudflare:
      image: cloudflare/cloudflared:latest
      container_name: cloudflare-tunnel
      command: tunnel --no-autoupdate run --token {{CF_TOKEN_YAML}}
      restart: unless-stopped

volumes:
  redis: ./data/redis
  postgres: ./data/postgres
